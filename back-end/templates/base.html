<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyEnglish</title>
    <script src="https://cdn.tailwindcss.com"></script>
    {% block extra_head %}{% endblock %}
</head>

<body class="bg-gray-100 min-h-screen">

    {% if request.user.is_authenticated %}
        {% include 'components/navbar.html' %}
    {% endif %}

    {% if messages %}
        <div class="container mx-auto px-4 py-4">
            {% for message in messages %}
                <div class="rounded border px-4 py-3 mb-2 {% if 'success' in message.tags %}bg-green-100 text-green-800{% elif 'error' in message.tags %}bg-red-100 text-red-800{% else %}bg-blue-100 text-blue-800{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
    {% endif %}

    <main class="container mx-auto px-4 py-6">
        {% block content %}{% endblock %}
    </main>

    {% block extra_scripts %}{% endblock %}

</body>
</html>
