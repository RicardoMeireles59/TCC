<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EasyEnglish – Login</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0f0f;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #e8e8e8;
    }

    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 2rem;
      width: 100%;
      max-width: 380px;
    }

    .logo {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .logo span { color: #4ade80; }

    .subtitle {
      color: #888;
      font-size: 0.875rem;
      margin-top: 0.25rem;
    }

    .divider {
      height: 1px;
      background: #2a2a2a;
      margin: 1.25rem 0;
    }

    .error-box {
      background: #3b1414;
      border: 1px solid #7f1d1d;
      color: #fca5a5;
      border-radius: 8px;
      padding: 0.75rem 1rem;
      font-size: 0.875rem;
      margin-bottom: 1rem;
    }

    label {
      display: block;
      font-size: 0.8rem;
      color: #aaa;
      margin-bottom: 0.3rem;
      margin-top: 0.75rem;
    }

    input {
      width: 100%;
      background: #111;
      border: 1px solid #333;
      border-radius: 8px;
      color: #e8e8e8;
      padding: 0.65rem 0.9rem;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus { border-color: #4ade80; }

    .btn {
      width: 100%;
      margin-top: 1.5rem;
      padding: 0.7rem;
      background: #4ade80;
      color: #0f0f0f;
      font-weight: 700;
      font-size: 0.95rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Easy<span>English</span></div>
    <div class="subtitle">Entre para revisar seus flashcards</div>
    <div class="divider"></div>

    {% if error %}
    <div class="error-box">{{ error }}</div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <label for="username">Usuário</label>
      <input type="text" id="username" name="username" autocomplete="username"
             autofocus placeholder="seu usuário" required>

      <label for="password">Senha</label>
      <input type="password" id="password" name="password" autocomplete="current-password"
             placeholder="••••••••" required>

      <button type="submit" class="btn">Entrar</button>
    </form>
  </div>
</body>
</html>
