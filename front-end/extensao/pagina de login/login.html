<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>EasyEnglish – Login</title>
  <link rel="stylesheet" href="login.css">
  <style>
    /* posição relativa no body para o botão de tema */
    body { position: relative; }
  </style>
</head>
<body>

  <!-- Alternar tema dark / white -->
  <button class="theme-toggle" id="themeToggle" title="Alternar tema">☀️ White</button>

  <div class="card">

    <!-- Cabeçalho -->
    <div class="header">
      <span class="logo">Easy<span>English</span></span>
      <span class="subtitle">Entre para salvar seus flashcards</span>
    </div>

    <div class="divider"></div>

    <!-- Feedback de erro/sucesso -->
    <div id="feedback" class="feedback hidden"></div>

    <!-- E-mail -->
    <div class="input-wrapper">
      <svg class="input-icon" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" aria-hidden="true">
        <rect x="2" y="4" width="20" height="16" rx="2"/>
        <polyline points="2,4 12,13 22,4"/>
      </svg>
      <input
        type="email"
        id="emailField"
        class="input"
        placeholder="E-mail"
        autocomplete="email"
        aria-label="E-mail"
      >
    </div>

    <!-- Senha -->
    <div class="input-wrapper">
      <svg class="input-icon" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" aria-hidden="true">
        <rect x="3" y="11" width="18" height="11" rx="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
      <input
        type="password"
        id="passwordField"
        class="input"
        placeholder="Senha"
        autocomplete="current-password"
        aria-label="Senha"
      >
    </div>

    <!-- Esqueci a senha -->
    <a id="forgotLink" class="forgot-link" role="button" tabindex="0">
      Esqueci minha senha
    </a>

    <!-- Botão Entrar -->
    <button id="loginBtn" class="btn-primary">Entrar</button>

    <!-- Criar conta -->
    <p class="footer-text">
      Ainda não tem conta? <a id="registerLink" role="button" tabindex="0">Criar conta</a>
    </p>

  </div>

  <script src="login.js"></script>
</body>
</html>
