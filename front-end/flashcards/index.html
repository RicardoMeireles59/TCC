<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Flashcards</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <h1>Sistema de Revisão de Flashcards</h1>

    <!-- BARRA SUPERIOR -->

    <div class="barra-status">

        <div class="status-card acertos">

            <h2 id="total-acertos">0</h2>

            <p>Acertos</p>

        </div>

        <div class="status-card revisao">

            <h2 id="total-revisao">0</h2>

            <p>Revisões</p>

        </div>

        <div class="status-card erros">

            <h2 id="total-erros">0</h2>

            <p>Erros</p>

        </div>

    </div>

    <!-- CONTADOR -->

    <div class="contador">

        Card
        <span id="card-atual">1</span>
        de
        <span id="total-cards">1</span>

    </div>

    <!-- ÁREA DE REVISÃO -->

    <div class="review-container">

        <div class="flashcard" id="flashcard">

            <div class="card" id="card">

                <!-- FRENTE -->

                <div class="front">

                    <h2>Pergunta</h2>

                    <p id="pergunta-card"></p>

                </div>

                <!-- VERSO -->

                <div class="back">

                    <h2>Resposta</h2>

                    <p id="resposta-card"></p>

                </div>

            </div>

        </div>

    </div>

    <!-- BOTÕES -->

    <div class="controles">

        <button onclick="cardAnterior()">
            ⬅ Anterior
        </button>

        <button onclick="virarCard()">
            🔄 Virar Card
        </button>

        <button onclick="proximoCard()">
            Próximo ➡
        </button>

    </div>

    <!-- STATUS -->

    <div class="status-resposta">

        <button
            class="acertou-btn"
            onclick="marcarAcerto()"
        >
            Acertei
        </button>

        <button
            class="revisar-btn"
            onclick="marcarRevisao()"
        >
            Revisar
        </button>

        <button
            class="errou-btn"
            onclick="marcarErro()"
        >
            Errei
        </button>

    </div>

    <script src="script.js"></script>

</body>

</html>
