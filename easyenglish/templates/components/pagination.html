{% if page_obj.paginator.num_pages > 1 %}
<div class="pagination">
    {% if page_obj.has_previous %}
        <a class="btn-outline" href="?page={{ page_obj.previous_page_number }}">Anterior</a>
    {% endif %}
    <span class="page-info">Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}
        <a class="btn-outline" href="?page={{ page_obj.next_page_number }}">Próxima</a>
    {% endif %}
</div>
{% endif %}
