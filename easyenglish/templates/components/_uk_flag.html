{% comment %}Pequeno emblema da Union Jack — representa "inglês" sem ambiguidade com outras bandeiras tricolores.{% endcomment %}
<span class="flag-badge" aria-hidden="true">
    <svg viewBox="0 0 60 36" preserveAspectRatio="none">
        <rect width="60" height="36" fill="#1B2F63"/>
        <g stroke="#fff" stroke-width="6"><line x1="0" y1="0" x2="60" y2="36"/><line x1="60" y1="0" x2="0" y2="36"/></g>
        <g stroke="#D31E2B" stroke-width="2.4"><line x1="0" y1="0" x2="60" y2="36"/><line x1="60" y1="0" x2="0" y2="36"/></g>
        <rect x="24" width="12" height="36" fill="#fff"/>
        <rect y="12" width="60" height="12" fill="#fff"/>
        <rect x="27" width="6" height="36" fill="#D31E2B"/>
        <rect y="15" width="60" height="6" fill="#D31E2B"/>
    </svg>
</span>
