<div class="bg-white p-4 rounded shadow flex flex-col">

    {% if flashcard.video %}
        <img src="{{ flashcard.video.thumbnail }}" class="w-full rounded mb-3">
        <h2 class="font-bold text-lg mb-2">{{ flashcard.video.title }}</h2>
    {% endif %}

    <span class="text-xs uppercase tracking-wide text-blue-600 mb-1">
        {{ flashcard.get_deck_display }}
    </span>

    <p class="mb-1 font-medium">{{ flashcard.phrase }}</p>
    <p class="text-gray-600 mb-3">{{ flashcard.translation }}</p>

    <form method="POST" action="{% url 'update_flashcard_status' flashcard.id %}" class="mt-auto">
        {% csrf_token %}
        <select name="status" class="border p-2 rounded w-full mb-2">
            <option value="new"      {% if flashcard.status == 'new' %}selected{% endif %}>Novo</option>
            <option value="learning" {% if flashcard.status == 'learning' %}selected{% endif %}>Aprendendo</option>
            <option value="reviewed" {% if flashcard.status == 'reviewed' %}selected{% endif %}>Revisado</option>
        </select>
        <input type="number" name="progress" value="{{ flashcard.progress }}" min="0" max="100"
               class="border p-2 rounded w-full mb-2">
        <button class="bg-blue-600 text-white px-4 py-2 rounded w-full">Atualizar progresso</button>
    </form>

    <div class="flex gap-2 mt-2">
        <a href="{% url 'flashcard_edit' flashcard.id %}"
           class="flex-1 text-center border border-gray-300 text-gray-700 px-3 py-2 rounded hover:bg-gray-50">
            Editar
        </a>
        <form method="POST" action="{% url 'flashcard_delete' flashcard.id %}" class="flex-1"
              onsubmit="return confirm('Excluir este flashcard?');">
            {% csrf_token %}
            <button class="w-full border border-red-300 text-red-600 px-3 py-2 rounded hover:bg-red-50">
                Excluir
            </button>
        </form>
    </div>

</div>
