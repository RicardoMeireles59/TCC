<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>EasyEnglish</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>

  <!-- Sair da conta -->
  <button class="logout-btn" id="logoutBtn" title="Sair da conta">Sair</button>

  <!-- Alternar tema dark / white -->
  <button class="theme-toggle" id="themeToggle">☀️ White</button>

  <div class="card">

    <!-- Logo -->
    <div class="header">
      <span class="logo">Easy<span>English</span></span>
    </div>

    <div class="divider"></div>

    <!-- Toggle Ativar + Feedback -->
    <div class="top-row">
      <label class="toggle-label">
        <div class="toggle">
          <input type="checkbox" id="toggleActive">
          <span class="slider"></span>
        </div>
        <span>Ativar captura</span>
      </label>
      <div id="feedback" class="feedback hidden"></div>
    </div>

    <!-- Frase -->
    <input type="text" id="phraseField" class="input" placeholder="Frase">

    <!-- Tradução -->
    <input type="text" id="translationField" class="input" placeholder="Tradução">

    <!-- Baralho (opções carregadas da API com os baralhos do usuário) -->
    <select id="deckSelect" class="input select">
      <option value="" selected>Sem baralho</option>
    </select>

    <!-- Enviar -->
    <button id="sendBtn" class="btn-send">Enviar</button>

  </div>

  <script src="popup.js"></script>
</body>

</html>
